<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#eef2f7;
        }

        nav{
            background:#0077ff;
            padding:15px;
            display:flex;
            justify-content:center;
            gap:30px;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-size:20px;
            font-weight:bold;
        }

        .card{
            width:700px;
            margin:80px auto;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,.2);
            text-align:center;
        }

        h1{
            color:#0077ff;
        }

        p{
            margin-top:20px;
            line-height:30px;
            color:#555;
            font-size:18px;
        }

        button{
            margin-top:30px;
            padding:12px 25px;
            background:#0077ff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:18px;
        }

        button:hover{
            background:#005fd1;
        }

    </style>

</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
</nav>

<div class="card">

<h1>About Flask Project</h1>

<p>
This website is created using Python Flask Framework.
Flask is a lightweight web framework that helps developers
build fast and secure web applications.
</p>

<a href="/">
<button>Back To Home</button>
</a>

</div>

</body>
</html>
